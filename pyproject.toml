[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagents-mcp-privacy"
version = "0.3.0"
description = "A fail-closed privacy gateway for MCP tools and Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.3",
    "fastmcp>=2.0",
    "langchain-mcp-adapters>=0.3",
    "langchain-openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
deepagents-mcp-privacy = "deepagents_mcp_privacy.runner:main"
table-mcp-server = "deepagents_mcp_demo.server:main"
table-mcp-smoke = "deepagents_mcp_demo.smoke:main"
table-deep-agent = "deepagents_mcp_demo.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_mcp_privacy", "src/deepagents_mcp_demo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
